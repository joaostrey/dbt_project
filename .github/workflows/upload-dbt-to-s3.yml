
name: Upload dbt project to S3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r dbt-project.zip . \
            -x ".git/*" \
               ".github/*" \
               ".venv/*" \
               "venv/*" \
               "dbt-project.zip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload ZIP to S3
        run: |
          aws s3 cp dbt-project.zip \
            s3://${{ vars.S3_BUCKET }}/dbt-project.zip

      - name: Start CodeBuild
        id: codebuild
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name deploy-dbt \
            --query 'build.id' \
            --output text)

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "CodeBuild iniciado: $BUILD_ID"

      - name: Wait for CodeBuild
        env:
          BUILD_ID: ${{ steps.codebuild.outputs.build_id }}
        run: |
          for i in $(seq 1 240); do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)

            echo "Status do CodeBuild: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              exit 0
            fi

            if [ "$STATUS" != "IN_PROGRESS" ]; then
              echo "CodeBuild terminou com status: $STATUS"
              exit 1
            fi

            sleep 15
          done

          echo "Tempo limite aguardando o CodeBuild."
          exit 1

      - name: Download updated manifest from S3
        run: |
          mkdir -p target

          aws s3 cp \
            s3://${{ vars.S3_BUCKET }}/dbt-state/manifest.json \
            target/manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add target/manifest.json

          if ! git diff --cached --quiet; then
            git commit -m "Update dbt manifest [skip ci]"
            git push
          else
            echo "O manifest não teve alterações."
          fi
