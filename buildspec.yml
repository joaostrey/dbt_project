
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - mkdir -p ~/.dbt
      - |
        cat > ~/.dbt/profiles.yml <<'EOF'
        deploy_aws:
          target: dev
          outputs:
            dev:
              type: postgres
              host: "{{ env_var('DB_HOST') }}"
              user: "{{ env_var('DB_USER') }}"
              password: "{{ env_var('DB_PASSWORD') }}"
              port: 5432
              dbname: "{{ env_var('DB_NAME') }}"
              schema: public
              threads: 1
        EOF

  build:
    commands:
      - dbt --version
      - dbt debug
      - dbt run

