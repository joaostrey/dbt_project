version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - mkdir -p ~/.dbt
      - |
        cat > ~/.dbt/profiles.yml <<'EOF'
        deploy_aws:
          target: dev
          outputs:
            dev:
              type: postgres
              host: "{{ env_var('DB_HOST') }}"
              user: "{{ env_var('DB_USER') }}"
              password: "{{ env_var('DB_PASSWORD') }}"
              port: 5432
              dbname: "{{ env_var('DB_NAME') }}"
              schema: public
              threads: 1
        EOF

  build:
    commands:
      - |
        set -e

        cd deploy_aws

        dbt --version
        dbt debug

        # Preserve the previous manifest before dbt updates target/
        mkdir -p /tmp/dbt-state

        if [ -f target/manifest.json ]; then
          cp target/manifest.json /tmp/dbt-state/manifest.json

          echo "Previous manifest found. Running modified models."

          dbt run \
            --select state:modified+ \
            --state /tmp/dbt-state
        else
          echo "No previous manifest found. Running all models."

          dbt run
        fi

        # Publish only after dbt run succeeds
        aws s3 cp \
          target/manifest.json \
          "s3://${S3_BUCKET}/dbt-state/manifest.json"
